server {
    listen 80;
    listen [::]:80;
    server_name kairo-sengmey-dev.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/app/current/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kairo-sengmey-dev.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/kairo-sengmey-dev.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kairo-sengmey-dev.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/problem+json
        application/x-javascript
        text/css
        text/javascript
        text/plain
        text/xml;

    client_body_buffer_size 128k;
    client_max_body_size 10m;
    keepalive_timeout 65s;
    keepalive_requests 1000;

    location / {
        proxy_pass http://nodejs_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;

        # Keep HTTP/1.1 upstream sockets reusable while retaining WebSocket upgrades.
        proxy_socket_keepalive on;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
        proxy_request_buffering on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
