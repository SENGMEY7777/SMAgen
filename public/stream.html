<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAIRO AI • Real-Time Live Streaming Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #131926;
      --border: #1f293d;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 32px 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 860px; }
    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 6px; letter-spacing: -0.5px; }
    header p { color: var(--text-muted); font-size: 14px; }
    .badge { display: inline-block; background: rgba(16,185,129,0.15); color: var(--accent); padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-bottom: 10px; border: 1px solid rgba(16,185,129,0.3); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    input, textarea, select { width: 100%; background: #0c111c; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 70px; font-family: inherit; }
    .row { display: flex; gap: 12px; }
    button { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .output-card { min-height: 240px; display: flex; flex-direction: column; }
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .output-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stats { font-size: 12px; font-family: 'JetBrains Mono', monospace; color: var(--accent); }
    .stream-box { flex: 1; background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-y: auto; max-height: 480px; }
    .cursor { display: inline-block; width: 8px; height: 16px; background: var(--primary); margin-left: 3px; vertical-align: middle; animation: blink 1s infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">● LIVE SERVER-SENT EVENTS (SSE) STREAMING</div>
      <h1>KAIRO AI Live Stream Demonstration</h1>
      <p>Real-time token generation stream connected to Singapore AWS EC2</p>
    </header>

    <div class="card">
      <div class="field">
        <label for="token">Bearer Token (JWT)</label>
        <input type="text" id="token" placeholder="Paste your Bearer Token from Login here..." />
      </div>

      <div class="row">
        <div class="field" style="flex: 1;">
          <label for="endpoint">Streaming Mode</label>
          <select id="endpoint">
            <option value="/api/v1/chat/stream">💬 Chat Stream (Word-by-Word Live AI Generation)</option>
            <option value="/api/v1/workflow/run/stream">⚡ Workflow Run Stream (DAG Planner Progress)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="prompt">Your Prompt / Goal</label>
        <textarea id="prompt">Explain how Node.js event loop works in 3 clear bullet points.</textarea>
      </div>

      <button id="sendBtn" onclick="startStreaming()">
        <span>🚀 Start Real-Time Live Stream</span>
      </button>
    </div>

    <div class="card output-card">
      <div class="output-header">
        <span class="output-title">Live AI Output</span>
        <span id="stats" class="stats">Ready</span>
      </div>
      <div id="streamBox" class="stream-box">Click "Start Real-Time Live Stream" to see tokens streaming word-by-word in real time...</div>
    </div>
  </div>

  <script>
    async function startStreaming() {
      const token = document.getElementById('token').value.trim();
      const endpoint = document.getElementById('endpoint').value;
      const prompt = document.getElementById('prompt').value.trim();
      const sendBtn = document.getElementById('sendBtn');
      const streamBox = document.getElementById('streamBox');
      const stats = document.getElementById('stats');

      if (!token) {
        alert('Please enter your Bearer Token first!');
        return;
      }
      if (!prompt) {
        alert('Please enter a prompt!');
        return;
      }

      sendBtn.disabled = true;
      streamBox.innerHTML = '<span class="cursor"></span>';
      stats.textContent = 'Connecting to stream...';

      const startTime = performance.now();
      let tokenCount = 0;
      let textBuffer = '';

      try {
        const bodyPayload = endpoint.includes('/chat')
          ? { message: prompt }
          : { goalPrompt: prompt, workflowId: null };

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
            'Accept': 'text/event-stream',
          },
          body: JSON.stringify(bodyPayload),
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.message || `HTTP ${response.status} Error`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6));
                
                if (data.event === 'chunk' && data.text) {
                  textBuffer += data.text;
                  tokenCount++;
                  streamBox.innerHTML = escapeHtml(textBuffer) + '<span class="cursor"></span>';
                  streamBox.scrollTop = streamBox.scrollHeight;
                } else if (data.event === 'plan_created' || data.event === 'status') {
                  textBuffer += `\n[${data.event.toUpperCase()}] ${JSON.stringify(data.data || data.message, null, 2)}\n`;
                  streamBox.innerHTML = escapeHtml(textBuffer) + '<span class="cursor"></span>';
                }

                const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
                stats.textContent = `⚡ Live: ${elapsed}s | Chunks: ${tokenCount}`;
              } catch (e) {}
            }
          }
        }

        const totalTime = ((performance.now() - startTime) / 1000).toFixed(2);
        streamBox.innerHTML = escapeHtml(textBuffer);
        stats.textContent = `✅ Completed in ${totalTime}s (${tokenCount} stream chunks)`;
      } catch (error) {
        streamBox.innerHTML = `<span style="color: #ef4444;">❌ Error: ${escapeHtml(error.message)}</span>`;
        stats.textContent = 'Stream Failed';
      } finally {
        sendBtn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
